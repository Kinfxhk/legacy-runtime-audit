name: build

on:
  push:
  pull_request:

jobs:
  build:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build (PowerShell 7)
        shell: pwsh
        run: ./build.ps1

      - name: Build (Windows PowerShell 5.1)
        shell: powershell
        run: ./build.ps1

      - uses: actions/upload-artifact@v4
        with:
          name: legacy-runtime-audit
          path: dist/*.zip
